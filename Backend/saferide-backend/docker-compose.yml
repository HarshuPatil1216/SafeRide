services:
  mysql:
    image: mysql:8.0
    container_name: saferide-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: "1216"
      MYSQL_DATABASE: saferide_db

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p1216 --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  saferide-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: saferide-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8081:8080"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/saferide_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: "1216"

volumes:
  mysql-data: